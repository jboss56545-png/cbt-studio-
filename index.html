function dialog(opts){
  return new Promise(function(resolve){
    var ov=document.createElement('div');ov.className='modal-overlay';
    var box=document.createElement('div');box.className='modal';
    box.innerHTML='<h3>'+esc(opts.title||'')+'</h3><p>'+(opts.html||esc(opts.message||''))+'</p>';
    var acts=document.createElement('div');acts.className='modal-actions';
    (opts.buttons||[{text:'OK',primary:true,value:true}]).forEach(function(b){
      var btn=document.createElement('button');btn.type='button';btn.className='btn'+(b.primary?' primary':'')+(b.danger?' danger':'');btn.textContent=b.text;
      btn.onclick=function(){if(ov.parentNode)document.body.removeChild(ov);resolve(b.value)};acts.appendChild(btn);
    });
    box.appendChild(acts);ov.appendChild(box);
    ov.addEventListener('click',function(e){if(e.target===ov){if(ov.parentNode)document.body.removeChild(ov);resolve(null)}});
    document.body.appendChild(ov);
  });
}

function safeParseJSON(text){
  if(!text)throw new Error('Empty response');
  var t=String(text).trim();
  t=t.replace(/^```(?:json)?\s*/i,'').replace(/\s*```\s*$/,'').trim();
  var s=t.indexOf('['),e=t.lastIndexOf(']');
  if(s>=0&&e>s)t=t.slice(s,e+1);
  try{return JSON.parse(t)}catch(err){}
  try{var lastClose=t.lastIndexOf('}');if(lastClose>0){var partial=t.slice(0,lastClose+1);var opens=(partial.match(/\[/g)||[]).length;var closes=(partial.match(/\]/g)||[]).length;while(opens>closes){partial+=']';closes++}return JSON.parse(partial)}}catch(e2){}
  throw new Error('Could not parse AI response');
}

function normQ(q){
  if(!q||typeof q!=='object')return null;
  var text=q.q||q.question||q.Q||q.text||'';
  var opts=q.options||q.opts||q.choices||q.answers||[];
  if(!Array.isArray(opts))opts=[];
  opts=opts.map(function(o){if(o&&typeof o==='object')return String(o.text||o.value||o.label||JSON.stringify(o));return String(o)}).filter(function(o){return o.trim().length});
  if(!text||opts.length<2)return null;
  var ans=q.ans;
  if(ans===undefined||ans===null)ans=q.answer;
  if(typeof ans==='string'){var tr=ans.trim().toUpperCase();var idx='ABCDEFGH'.indexOf(tr.charAt(0));if(tr.length===1&&idx>=0&&idx<opts.length)ans=idx;else{var n=parseInt(ans,10);ans=isNaN(n)?0:n}}
  ans=Number(ans);
  if(!isFinite(ans)||ans<0||ans>=opts.length||Math.floor(ans)!==ans)ans=0;
  var diff=String(q.diff||q.difficulty||'medium').toLowerCase();
  if(diff.indexOf('easy')>=0)diff='easy';else if(diff.indexOf('hard')>=0)diff='hard';else diff='medium';
  return {q:String(text).trim(),options:opts,ans:ans,topic:String(q.topic||q.chapter||q.subject||'General'),diff:diff,explain:String(q.explain||q.explanation||q.reason||'')};
}
function normaliseList(raw){
  var arr=[];
  if(Array.isArray(raw))arr=raw;
  else if(raw&&typeof raw==='object'){if(Array.isArray(raw.questions))arr=raw.questions;else if(Array.isArray(raw.data))arr=raw.data;else if(Array.isArray(raw.result))arr=raw.result}
  var out=[];for(var i=0;i<arr.length;i++){var n=normQ(arr[i]);if(n)out.push(n)}
  return out;
}

function extractPdf(file,onProgress){

  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return readAsArrayBuffer(file).then(function(buf){return pdfjsLib.getDocument({data:buf}).promise}).then(function(pdf){
    var total=pdf.numPages;var pages=[];var chain=Promise.resolve();
    for(var p=1;p<=total;p++){(function(pn){chain=chain.then(function(){return pdf.getPage(pn).then(function(page){return page.getTextContent()}).then(function(c){var s=c.items.map(function(it){return it.str});pages[pn-1]=s.join(' ');if(onProgress)onProgress(pn,total)}).catch(function(){pages[pn-1]=''})})})(p)}
    return chain.then(function(){return pages.join('\n\n')});
  });
}
function extractDocx(file){

    var cdCount=dv.getUint16(eocd+10,true);var cdOffset=dv.getUint32(eocd+16,true);var entries={};var p=cdOffset;
    for(var n=0;n<cdCount;n++){if(dv.getUint32(p,true)!==0x02014b50)break;var method=dv.getUint16(p+10,true);var compSize=dv.getUint32(p+20,true);var nameLen=dv.getUint16(p+28,true);var extraLen=dv.getUint16(p+30,true);var commentLen=dv.getUint16(p+32,true);var localOff=dv.getUint32(p+42,true);var name=new TextDecoder().decode(bytes.subarray(p+46,p+46+nameLen));entries[name]={method:method,compSize:compSize,localOff:localOff};p+=46+nameLen+extraLen+commentLen}
    var tgt=entries['word/document.xml'];if(!tgt)throw new Error('DOCX missing document.xml');
    var lh=tgt.localOff;var lNameLen=dv.getUint16(lh+26,true);var lExtraLen=dv.getUint16(lh+28,true);var dataStart=lh+30+lNameLen+lExtraLen;var comp=bytes.subarray(dataStart,dataStart+tgt.compSize);
    function inflate(u8){if(typeof DecompressionStream==='undefined')return Promise.reject(new Error('Browser cannot decompress'));var ds=new DecompressionStream('deflate-raw');var stream=new Blob([u8]).stream().pipeThrough(ds);return new Response(stream).arrayBuffer().then(function(ab){return new Uint8Array(ab)})}
    var promise=tgt.method===0?Promise.resolve(comp):inflate(comp);
    return promise.then(function(u8){var xml=new TextDecoder().decode(u8);xml=xml.replace(/<w:p[^>]*>/g,'\n').replace(/<\/w:p>/g,'\n');xml=xml.replace(/<w:tab[^>]*\/>/g,'\t').replace(/<w:br[^>]*\/>/g,'\n');xml=xml.replace(/<[^>]+>/g,'');xml=xml.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");return xml.replace(/\n{3,}/g,'\n\n').trim()});
  });

function extractTextFromFile(file,onProgress){
  var name=(file.name||'').toLowerCase();
  if(name.endsWith('.txt')||file.type==='text/plain')return readAsText(file);
  if(name.endsWith('.pdf')||file.type==='application/pdf')return extractPdf(file,onProgress);
  if(name.endsWith('.docx'))return extractDocx(file);
  if(name.endsWith('.doc'))return Promise.reject(new Error('Legacy .doc not supported.'));
  return readAsText(file);
}
function chunkText(text,size){
  size=size||5000;var chunks=[];var i=0;
  while(i<text.length){var end=Math.min(i+size,text.length);if(end<text.length){var slice=text.slice(i,end);var lastBreak=Math.max(slice.lastIndexOf('\n\n'),slice.lastIndexOf('. '));if(lastBreak>size*0.5)end=i+lastBreak+1}chunks.push(text.slice(i,end));i=end}
  return chunks;
}

function startAITest(){
  if(!state.subject){dialog({title:'Pick a subject',message:'Please select a subject first.'});return}
  var count=getRequestedCount();
  var chapters=state.chapters.length?state.chapters:['__FULL__'];
  var cfg={exam:state.exam,subject:state.subject,chapters:chapters,count:count,difficulty:state.difficulty};
  var prompt=buildPromptAI(cfg);
  function attempt(){
    showLoader('AI is generating questions…',state.exam+' • '+state.subject+' • '+count+' questions',attempt);
    aiCall(prompt,{source:'cbt-test-studio',mode:'ai',expectsJSON:true})
    .then(function(text){
      var list;
      try{list=normaliseList(safeParseJSON(text))}catch(e){throw new Error('Could not parse AI response. Try again.')}
      if(!list.length)throw new Error('AI returned no usable questions.');
      var fresh=dedupeQuestions(list);if(!fresh.length)fresh=list;
      fresh=fresh.map(shuffleOptions);
      addSeen(fresh.map(function(q){return q._h||hashStr(String(q.q))}));addRecentQ(fresh);
      hideLoader();
      launchTest({name:state.exam+' • '+state.subject,exam:state.exam,subject:state.subject,source:'ai',questions:fresh.slice(0,count),timerMode:state.timerMode,limitSec:state.timerMode==='down'?(parseInt($('timerMinutes').value,10)||15)*60:0});
    }).catch(function(err){showLoader('Could not generate questions',err.message||'Unknown',attempt)});
  }
  attempt();
}
function shuffleOptions(q){
  var opts=q.options.slice();var correctText=opts[q.ans];
  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=opts[i];opts[i]=opts[j];opts[j]=t}
  var newAns=opts.indexOf(correctText);if(newAns<0)newAns=0;q.options=opts;q.ans=newAns;return q;
}

function handleFileUpload(file){
  if(!file)return;
  var sizeKB=file.size/1024;
  if(sizeKB<1){dialog({title:'File too small',message:'Min 1 KB.'});return}
  if(file.size>100*1024*1024){dialog({title:'File too large',message:'Maximum 100 MB.'});return}
  var progressWrap=$('uploadProgress');var progressBar=$('uploadProgressBar');var progressText=$('uploadProgressText');
  progressWrap.classList.remove('hidden');progressBar.style.width='2%';progressText.textContent='Reading file…';
  var isNotesMode=uploadMode==='notes';
  extractTextFromFile(file,function(page,total){var pct=2+Math.round((page/total)*28);progressBar.style.width=pct+'%';progressText.textContent='Extracting text… page '+page+' of '+total})
  .then(function(text){
    text=String(text||'').replace(/\s+\n/g,'\n').trim();
    if(text.length<200)throw new Error('Not enough text extracted. Scanned PDF hai to text nahi milega.');
    progressBar.style.width='32%';progressText.textContent='Analysing…';
    if(!isNotesMode){
      var qMarkers=(text.match(/\bQ(?:uestion)?\.?\s*\d+/gi)||[]).length;
      var optMarkers=(text.match(/\([A-D1-4]\)/g)||[]).length;
      if(qMarkers<2&&optMarkers<4)throw new Error('Is PDF me questions nahi mile. Agar notes/book hai to "Generate from Notes" mode use karo.');
    }
    var chunks=chunkText(text,5000);
    var perChunk=isNotesMode?8:20;
    var collected=[];
    var recent=getRecentQ();
    var completed=0;var totalChunks=chunks.length;
    var PARALLEL=2;
    var tasks=chunks.map(function(chunk,i){
      return function(){
        return new Promise(function(resolve){
          setTimeout(function(){
            var prompt=isNotesMode?buildPromptNotes(chunk,perChunk,state.subject||''):buildPromptExtract(chunk,perChunk,state.subject||'',recent.slice(-8));
            var mode=isNotesMode?'notes':'extract';
            aiCall(prompt,{source:'cbt-test-studio',mode:mode,expectsJSON:true})
            .then(function(raw){
              var list=[];
              try{list=normaliseList(safeParseJSON(raw))}catch(e){console.warn('Chunk '+(i+1)+' parse failed:',e.message)}
              collected=collected.concat(list);
              completed++;
              var pct=32+Math.round((completed/totalChunks)*62);
              progressBar.style.width=pct+'%';
              progressText.textContent='Part '+completed+'/'+totalChunks+' — '+collected.length+' questions collected…';
              resolve();
            }).catch(function(e){console.warn('Chunk '+(i+1)+' failed:',e.message);completed++;resolve()});
          },(i%PARALLEL)*300);
        });
      };
    });
    return new Promise(function(resolve){
      var index=0;
      function runBatch(){
        if(index>=tasks.length){resolve();return}
        var batch=[];
        for(var k=0;k<PARALLEL&&index<tasks.length;k++,index++)batch.push(tasks[index]());
        Promise.all(batch).then(runBatch);
      }
      runBatch();
    }).then(function(){
      if(!collected.length)throw new Error(isNotesMode?'AI notes se questions nahi bana paya.':"PDF me koi question nahi mila. 'Generate from Notes' mode try karo.");
      var fresh=dedupeQuestions(collected);
      if(!fresh.length)fresh=collected;
      if(isNotesMode)fresh=fresh.map(shuffleOptions);
      addSeen(fresh.map(function(q){return q._h||hashStr(String(q.q))}));addRecentQ(fresh);
      return fresh;
    });
  }).then(function(questions){
    progressBar.style.width='100%';progressText.textContent='Saving '+questions.length+' questions…';
    var id='bank_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    var bank={id:id,name:file.name,exam:state.exam,subject:state.subject||'',mode:uploadMode,created:new Date().toISOString(),questions:questions};
    return IDB.put(bank).then(function(){
      setTimeout(function(){
        progressWrap.classList.add('hidden');renderBanks();
        dialog({title:'✅ Bank created',message:questions.length+' questions saved from "'+file.name+'"',buttons:[{text:'Later',value:false},{text:'Start Test',primary:true,value:true}]}).then(function(go){if(go)startFromBank(bank,0,true)});
      },350);
    });
  }).catch(function(err){
    progressWrap.classList.add('hidden');
    dialog({title:'Upload failed',message:err&&err.message?err.message:'Unknown error',buttons:[{text:'OK',primary:true,value:true}]});
  });
}

function startFromBank(bank,cursor,restart){
  var total=bank.questions.length;
  if(!total){dialog({title:'Empty bank',message:'No questions.'});return}
  var start=restart?0:Math.min(cursor,total);
  if(start>=total){dialog({title:'🎉 Completed',message:'All attempted. Restart?',buttons:[{text:'Cancel',value:false},{text:'Restart',primary:true,value:true}]}).then(function(ok){if(ok)startFromBank(bank,0,true)});return}
  var take=Math.min(total-start,Math.max(20,total-start));
  var slice=bank.questions.slice(start,start+take).map(function(q){return JSON.parse(JSON.stringify(q))});
  if(bank.mode==='notes')slice=slice.map(shuffleOptions);
  launchTest({name:bank.name,exam:state.exam,subject:bank.subject||'',source:'bank',bankId:bank.id,startIndex:start,questions:slice,timerMode:state.timerMode||'up',limitSec:state.timerMode==='down'?(parseInt($('timerMinutes').value,10)||15)*60:0});
}

function launchTest(cfg){
  T={id:'test_'+Date.now(),name:cfg.name,exam:cfg.exam||'',subject:cfg.subject||'',source:cfg.source||'ai',bankId:cfg.bankId||null,startIndex:cfg.startIndex||0,timerMode:cfg.timerMode||'up',limitSec:cfg.limitSec||0,elapsed:0,questions:cfg.questions,answers:cfg.questions.map(function(){return null}),marked:cfg.questions.map(function(){return false}),visited:cfg.questions.map(function(_,i){return i===0}),cur:0,startedAt:Date.now(),submitted:false};
  LS.set(K.ACTIVE,T);
  $('testTitle').textContent=T.name;
  showScreen('screen-test');
  $('palette').classList.remove('open');
  startTimers();renderQuestion();renderPalette();
}
function startTimers(){
  stopTimers();updateTimerDisplay();
  timerHandle=setInterval(function(){if(!T||T.submitted)return;T.elapsed++;updateTimerDisplay();if(T.timerMode==='down'&&T.limitSec>0&&T.elapsed>=T.limitSec){clearInterval(timerHandle);timerHandle=null;autoSubmit()}},1000);
  autosaveHandle=setInterval(function(){if(!T||T.submitted)return;LS.set(K.ACTIVE,T)},5000);
}
function stopTimers(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}if(autosaveHandle){clearInterval(autosaveHandle);autosaveHandle=null}}
function updateTimerDisplay(){if(!T)return;var el=$('timerDisplay');if(T.timerMode==='down'&&T.limitSec>0){var remaining=Math.max(0,T.limitSec-T.elapsed);el.textContent=fmtTime(remaining);el.classList.toggle('warn',remaining<=60)}else{el.textContent=fmtTime(T.elapsed);el.classList.remove('warn')}}
function renderQuestion(){
  if(!T)return;var q=T.questions[T.cur];if(!q)return;
  $('qCounter').textContent='Question '+(T.cur+1)+' of '+T.questions.length;
  $('qTopic').textContent=q.topic||'General';
  var dEl=$('qDiff');dEl.textContent=q.diff||'medium';dEl.className='badge '+(q.diff||'medium');
  var qText=q.q||'';
  var imgMatch=qText.match(/\[IMG:(.*?)\]/);
  if(imgMatch){var imgUrl=imgMatch[1];var cleanText=qText.replace(/\[IMG:.*?\]/,'').trim();$('qText').innerHTML=esc(cleanText)+'<div style="margin-top:14px;text-align:center"><img src="'+esc(imgUrl)+'" style="max-width:100%;border-radius:12px;border:1px solid var(--border)" onerror="this.style.display=\'none\'" alt="Diagram"></div>'}
  else{$('qText').textContent=qText}
  var box=$('optionsBox');box.innerHTML='';
  var letters=['A','B','C','D','E','F','G','H'];
  q.options.forEach(function(opt,i){var b=document.createElement('button');b.type='button';b.className='option'+(T.answers[T.cur]===i?' selected':'');b.innerHTML='<span class="opt-key">'+letters[i]+'</span><span>'+esc(opt)+'</span>';b.onclick=function(){T.answers[T.cur]=i;T.visited[T.cur]=true;LS.set(K.ACTIVE,T);renderQuestion();renderPalette()};box.appendChild(b)});
  $('btnNext').textContent=(T.cur===T.questions.length-1)?'Save & Review':'Save & Next →';
  $('btnPrev').disabled=(T.cur===0);
  $('btnMark').textContent=T.marked[T.cur]?'🚩 Unmark':'🚩 Mark';
  $('qArea').scrollTop=0;renderPalette();
}
function renderPalette(){
  if(!T)return;var grid=$('paletteGrid');grid.innerHTML='';
  T.questions.forEach(function(q,i){
    var cls='grey';if(T.marked[i])cls='purple';else if(T.answers[i]!==null&&T.answers[i]!==undefined)cls='green';else if(T.visited[i])cls='red';
    var b=document.createElement('button');b.type='button';b.className='pal-btn '+cls+(i===T.cur?' cur':'');b.textContent=i+1;
    b.onclick=function(){T.visited[i]=true;T.cur=i;LS.set(K.ACTIVE,T);$('palette').classList.remove('open');renderQuestion()};grid.appendChild(b);
  });
}
function goNext(){if(!T)return;if(T.cur<T.questions.length-1){T.cur++;T.visited[T.cur]=true;LS.set(K.ACTIVE,T);renderQuestion()}else confirmSubmit()}
function goPrev(){if(!T||T.cur===0)return;T.cur--;T.visited[T.cur]=true;LS.set(K.ACTIVE,T);renderQuestion()}
function toggleMark(){if(!T)return;T.marked[T.cur]=!T.marked[T.cur];T.visited[T.cur]=true;LS.set(K.ACTIVE,T);renderQuestion()}
function clearAnswer(){if(!T)return;T.answers[T.cur]=null;T.visited[T.cur]=true;LS.set(K.ACTIVE,T);renderQuestion()}
function confirmSubmit(){
  if(!T)return;var answered=0,marked=0;
  T.answers.forEach(function(a){if(a!==null&&a!==undefined)answered++});T.marked.forEach(function(m){if(m)marked++});
  var unanswered=T.questions.length-answered;
  dialog({title:'Submit test?',html:'Answered <b>'+answered+'</b> of <b>'+T.questions.length+'</b>.<br>'+(unanswered?'<span style="color:var(--orange)">'+unanswered+' unanswered</span><br>':'')+(marked?'<span style="color:var(--purple)">'+marked+' marked</span><br>':'')+'<br>Cannot be undone.',buttons:[{text:'Keep going',value:false},{text:'Submit',primary:true,value:true}]}).then(function(ok){if(ok)doSubmit()});
}
function autoSubmit(){dialog({title:'⏰ Time up!',message:'Auto-submitted.',buttons:[{text:'See results',primary:true,value:true}]}).then(function(){doSubmit()})}
function doSubmit(){
  if(!T)return;T.submitted=true;stopTimers();
  var questions=T.questions;var score=0;
  var details=questions.map(function(q,i){var user=(T.answers[i]===null||T.answers[i]===undefined)?-1:T.answers[i];var ok=(user===q.ans);if(ok)score++;return {q:q,user:user,ok:ok}});
  var total=questions.length;var pct=total?Math.round((score/total)*100):0;
  var result={name:T.name,exam:T.exam,subject:T.subject,date:new Date().toLocaleString(),score:score,total:total,pct:pct,elapsed:T.elapsed,timerMode:T.timerMode,details:details,marked:T.marked.slice(),source:T.source};
  if(T.bankId){var cm=LS.get(K.BOOKS,{});cm[T.bankId]=(T.startIndex||0)+T.questions.length;LS.set(K.BOOKS,cm)}
  var hist=LS.get(K.HISTORY,[]);hist.unshift({name:result.name,date:result.date,score:score,total:total,pct:pct});LS.set(K.HISTORY,hist.slice(0,25));
  LS.del(K.ACTIVE);renderResult(result);showScreen('screen-result');
}

function renderResult(r){
  var host=$('resultBody');var topics={};
  r.details.forEach(function(d){var t=d.q.topic||'General';if(!topics[t])topics[t]={right:0,total:0};topics[t].total++;if(d.ok)topics[t].right++});
  var topicRows=Object.keys(topics).map(function(t){var o=topics[t];return {name:t,right:o.right,total:o.total,acc:o.total?(o.right/o.total)*100:0}}).sort(function(a,b){return b.total-a.total});
  var weak=topicRows.filter(function(t){return t.acc<50});var strong=topicRows.filter(function(t){return t.acc>75});
  var circ=2*Math.PI*66;var dashOffset=circ*(1-(r.pct/100));
  var html='';
  html+='<div class="score-card"><div class="ring-wrap"><svg class="ring" viewBox="0 0 150 150"><defs><linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs><circle class="ring-bg" cx="75" cy="75" r="66"/><circle class="ring-fg" cx="75" cy="75" r="66" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+circ.toFixed(1)+'"/></svg><div class="ring-label"><div class="pct">'+r.pct+'%</div><div class="lbl">Score</div></div></div><div class="stat-grid"><div class="stat"><div class="v">'+r.score+' / '+r.total+'</div><div class="k">Correct</div></div><div class="stat"><div class="v">'+(r.total-r.score)+'</div><div class="k">Wrong / Skipped</div></div><div class="stat"><div class="v">'+fmtTime(r.elapsed)+'</div><div class="k">Time taken</div></div><div class="stat"><div class="v">'+(r.total?Math.round(r.elapsed/r.total)+'s':'0s')+'</div><div class="k">Avg / question</div></div></div></div>';
  html+='<div class="btn-row" style="margin-top:18px"><button type="button" class="btn primary" id="rRetake">🔁 Retake</button><button type="button" class="btn" id="rNew">✨ New Test</button><button type="button" class="btn" id="rHome">🏠 Home</button><button type="button" class="btn" id="rDownload">⬇ Download .txt</button></div>';
  html+='<h2 class="section-title">Topic-wise Performance</h2><div class="card">';
  if(!topicRows.length)html+='<p class="muted small">No topic data.</p>';
  topicRows.forEach(function(t){var cls=t.acc>=75?'good':(t.acc>=50?'mid':'bad');html+='<div class="bar-row"><div class="bar-top"><span>'+esc(t.name)+'</span><span class="muted">'+t.right+'/'+t.total+' • '+Math.round(t.acc)+'%</span></div><div class="bar-outer"><div class="bar-inner '+cls+'" style="width:'+Math.max(2,t.acc)+'%"></div></div></div>'});
  html+='</div>';
  html+='<h2 class="section-title">Weak Topics <span class="muted">(<50%)</span></h2><div class="card"><div class="tag-list">'+(weak.length?weak.map(function(t){return '<span class="tag weak">⚠ '+esc(t.name)+' — '+Math.round(t.acc)+'%</span>'}).join(''):'<span class="muted small">None 🎉</span>')+'</div></div>';
  html+='<h2 class="section-title">Strong Topics <span class="muted">(>75%)</span></h2><div class="card"><div class="tag-list">'+(strong.length?strong.map(function(t){return '<span class="tag strong">✓ '+esc(t.name)+' — '+Math.round(t.acc)+'%</span>'}).join(''):'<span class="muted small">Keep practising.</span>')+'</div></div>';
  html+='<h2 class="section-title">Question-by-Question Review</h2>';
  var letters=['A','B','C','D','E','F','G','H'];
  r.details.forEach(function(d,i){
    var q=d.q;var verdict=d.user<0?'<span class="verdict sk">SKIPPED</span>':(d.ok?'<span class="verdict ok">CORRECT</span>':'<span class="verdict no">WRONG</span>');
    html+='<div class="review-item"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px"><div class="muted small">Q'+(i+1)+' • '+esc(q.topic||'General')+'</div>'+verdict+'</div><div class="rq">'+esc(q.q)+'</div>';
    q.options.forEach(function(opt,oi){var cls='';if(oi===q.ans)cls='correct';else if(oi===d.user&&!d.ok)cls='wrong';var mark='';if(oi===q.ans&&oi===d.user)mark=' ✓ your answer';else if(oi===q.ans)mark=' ✓ correct answer';else if(oi===d.user)mark=' ✗ your answer';html+='<div class="rev-opt '+cls+'"><b>'+letters[oi]+'.</b><span>'+esc(opt)+mark+'</span></div>'});
    if(q.explain)html+='<div class="rev-explain"><b>Explanation:</b> '+esc(q.explain)+'</div>';
    html+='</div>';
  });
  host.innerHTML=html;
  $('rRetake').onclick=function(){var questions=r.details.map(function(d){return d.q});launchTest({name:r.name+' (retake)',exam:r.exam,subject:r.subject,source:r.source,questions:questions.map(function(q){return JSON.parse(JSON.stringify(q))}),timerMode:r.timerMode,limitSec:r.timerMode==='down'?r.elapsed:0})};
  $('rNew').onclick=function(){if(r.source==='bank')openUpload(uploadMode);else openSetup()};
  $('rHome').onclick=function(){renderHome();showScreen('screen-home')};
  $('rDownload').onclick=function(){downloadResult(r)};
  setTimeout(function(){var ring=host.querySelector('.ring-fg');if(ring){ring.style.transition='none';ring.style.strokeDashoffset=circ.toFixed(1);requestAnimationFrame(function(){ring.style.transition='stroke-dashoffset 1s cubic-bezier(.4,0,.2,1)';ring.style.strokeDashoffset=dashOffset.toFixed(1)})}},60);
}
function downloadResult(r){
  var lines=[];var letters=['A','B','C','D','E','F','G','H'];
  lines.push('===== CBT TEST STUDIO =====');lines.push('');lines.push('Test: '+r.name);lines.push('Exam: '+(r.exam||'—'));lines.push('Date: '+r.date);lines.push('Score: '+r.score+'/'+r.total+' ('+r.pct+'%)');lines.push('Time: '+fmtTime(r.elapsed));lines.push('');lines.push('--- REVIEW ---');lines.push('');
  r.details.forEach(function(d,i){var q=d.q;lines.push('Q'+(i+1)+'. '+q.q);lines.push('Topic: '+(q.topic||'General')+' | Diff: '+(q.diff||'medium'));
    q.options.forEach(function(opt,oi){var tag='';if(oi===q.ans)tag=' <-- CORRECT';if(oi===d.user&&oi!==q.ans)tag=' <-- your answer (wrong)';if(oi===d.user&&oi===q.ans)tag=' <-- your answer (correct)';lines.push('  '+letters[oi]+') '+opt+tag)});
    if(d.user<0)lines.push('  >> Not answered.');if(q.explain)lines.push('  Explanation: '+q.explain);lines.push('')});
  var blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='CBT_Result_'+r.name.replace(/[^\w\d]+/g,'_').slice(0,40)+'_'+Date.now()+'.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},2000);
}

function openSettings(){
  var theme=LS.raw(K.THEME,'dark');
  var ov=document.createElement('div');ov.className='modal-overlay';var box=document.createElement('div');box.className='modal';
  box.innerHTML='<h3>⚙️ Settings</h3>'+
    '<div class="field"><label>AI Source</label><p class="muted small" style="margin:0">Uses Vercel AI endpoint (<code>/api/ai-coach</code>). No API key needed here.</p></div>'+
    '<div class="field"><label>Appearance</label><div class="chip-row" id="sTheme"><button type="button" class="chip'+(theme==='dark'?' active':'')+'" data-theme="dark">🌙 Dark</button><button type="button" class="chip'+(theme==='light'?' active':'')+'" data-theme="light">☀️ Light</button></div></div>'+
    '<div class="field"><label>Data</label><div class="btn-row"><button type="button" class="btn small danger" id="sReset">🗑 Reset all</button><button type="button" class="btn small" id="sResetSeen">↺ Clear Q history</button></div><p class="muted small" style="margin:8px 0 0" id="sStats"></p></div>'+
    '<div class="modal-actions"><button type="button" class="btn" id="sCancel">Close</button></div>';
  ov.appendChild(box);document.body.appendChild(ov);
  function close(){if(ov.parentNode)document.body.removeChild(ov)}
  function updateStats(){var seen=getSeen().length;var hist=LS.get(K.HISTORY,[]).length;box.querySelector('#sStats').textContent=seen+' questions remembered • '+hist+' tests'}
  updateStats();
  box.querySelectorAll('#sTheme .chip').forEach(function(b){b.onclick=function(){box.querySelectorAll('#sTheme .chip').forEach(function(x){x.classList.remove('active')});b.classList.add('active');applyTheme(b.dataset.theme)}});
  box.querySelector('#sResetSeen').onclick=function(){LS.del(K.SEEN);LS.del(K.RECENT);updateStats()};
  box.querySelector('#sReset').onclick=function(){
    dialog({title:'Reset everything?',message:'Deletes all data.',buttons:[{text:'Cancel',value:false},{text:'Reset',primary:true,danger:true,value:true}]}).then(function(ok){
      if(!ok)return;LS.del(K.SEEN);LS.del(K.RECENT);LS.del(K.ACTIVE);LS.del(K.HISTORY);LS.del(K.BOOKS);
      IDB.all().then(function(banks){var chain=Promise.resolve();banks.forEach(function(b){chain=chain.then(function(){return IDB.del(b.id)})});return chain}).then(function(){close();renderHome();showScreen('screen-home');dialog({title:'Done',message:'All data cleared.',buttons:[{text:'OK',primary:true,value:true}]})});
    });
  };
  box.querySelector('#sCancel').onclick=close;
}
function applyTheme(theme){document.documentElement.setAttribute('data-theme',theme);LS.setRaw(K.THEME,theme);var meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute('content',theme==='light'?'#f5f6fb':'#0b0d12')}

function wireEvents(){
  var el;
  el=$('btnOpenSettings');if(el)el.onclick=openSettings;
  el=$('btnBackHome');if(el)el.onclick=function(){renderHome();showScreen('screen-home')};
  el=$('btnModeAI');if(el)el.onclick=openSetup;
  el=$('btnModeBook');if(el)el.onclick=function(){openUpload('extract')};
  el=$('btnModeNotes');if(el)el.onclick=function(){openUpload('notes')};
  el=$('btnSetupBack');if(el)el.onclick=function(){showScreen('screen-exam')};
  el=$('btnFullSubject');if(el)el.onclick=setFullSubject;
  el=$('btnClearChapters');if(el)el.onclick=clearChapters;
  el=$('btnStartTest');if(el)el.onclick=startAITest;
  el=$('btnUploadBack');if(el)el.onclick=function(){showScreen('screen-exam')};
  el=$('fileInput');if(el)el.onchange=function(e){var f=e.target.files&&e.target.files[0];if(f)handleFileUpload(f);e.target.value=''};
  el=$('btnPaletteToggle');if(el)el.onclick=function(){$('palette').classList.toggle('open')};
  el=$('btnPrev');if(el)el.onclick=goPrev;
  el=$('btnNext');if(el)el.onclick=goNext;
  el=$('btnMark');if(el)el.onclick=toggleMark;
  el=$('btnClear');if(el)el.onclick=clearAnswer;
  el=$('btnSubmit');if(el)el.onclick=confirmSubmit;
  el=$('btnResultHome');if(el)el.onclick=function(){renderHome();showScreen('screen-home')};

  document.addEventListener('keydown',function(e){
    if(!$('screen-test').classList.contains('active'))return;
    if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
    if(e.key==='ArrowRight')goNext();else if(e.key==='ArrowLeft')goPrev();else if(e.key==='m'||e.key==='M')toggleMark();
    else if(e.key==='1'||e.key==='2'||e.key==='3'||e.key==='4'){var idx=parseInt(e.key,10)-1;if(T&&T.questions[T.cur]&&idx<T.questions[T.cur].options.length){T.answers[T.cur]=idx;T.visited[T.cur]=true;LS.set(K.ACTIVE,T);renderQuestion()}}
  });

  window.addEventListener('beforeunload',function(e){if(T&&!T.submitted){LS.set(K.ACTIVE,T);e.preventDefault();e.returnValue='';return ''}});
}

var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;showInstallButton()});
function showInstallButton(){
  if(document.getElementById('installBtn'))return;
  var btn=document.createElement('button');btn.id='installBtn';btn.type='button';
  btn.className='icon-btn';btn.style.background='linear-gradient(135deg,#6366f1,#a855f7)';btn.style.color='#fff';btn.textContent='📥';btn.title='Install App';
  btn.onclick=function(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(function(choice){if(choice.outcome==='accepted'){btn.remove()}deferredPrompt=null})};
  var appbar=document.querySelector('#screen-home .appbar');
  if(appbar)appbar.appendChild(btn);
}
window.addEventListener('appinstalled',function(){deferredPrompt=null;var b=document.getElementById('installBtn');if(b)b.remove()});

(function init(){
  var theme=LS.raw(K.THEME,'dark');applyTheme(theme);
  wireEvents();renderHome();bindExamGrid();showScreen('screen-home');
  IDB.open().catch(function(){});
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/service-worker.js').catch(function(){})})}
})();
</script>

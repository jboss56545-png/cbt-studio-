<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CBT Test Studio</title>
<style>
:root{
  --bg:#0b0d12; --bg-2:#0f1219; --card:#161a24; --card-2:#1c2130;
  --border:#252b3a; --text:#e8ecf5; --muted:#8b95ad;
  --accent:#6366f1; --accent-2:#a855f7;
  --green:#22c55e; --red:#ef4444; --purple:#a855f7; --grey:#4b5563; --orange:#f59e0b;
  --radius:16px; --radius-sm:10px;
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --shadow-sm:0 4px 14px rgba(0,0,0,.28);
  --tap:44px;
}
[data-theme="light"]{
  --bg:#f5f6fb; --bg-2:#ffffff; --card:#ffffff; --card-2:#f2f4fa;
  --border:#e4e7f0; --text:#0f172a; --muted:#6b7280; --grey:#cbd5e1;
  --shadow:0 10px 30px rgba(15,23,42,.10);
  --shadow-sm:0 4px 14px rgba(15,23,42,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overscroll-behavior-y:none;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh; overflow-x:hidden;
}
body.no-scroll{overflow:hidden;position:fixed;width:100%;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;}
a{color:var(--accent-2);text-decoration:none;}
.hidden{display:none !important;}
.muted{color:var(--muted);}
.small{font-size:12.5px;}

.screen{display:none;}
.screen.active{display:block;animation:fadeUp .28s ease;}
#screen-test.active{display:flex;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.wrap{
  max-width:940px;margin:0 auto;padding:18px 16px 60px;
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
  padding-bottom:max(60px, calc(40px + env(safe-area-inset-bottom)));
}

.appbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 18px;}
.appbar-title{font-weight:700;font-size:16px;letter-spacing:-.01em;text-align:center;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:16px;}
.logo-dot{width:11px;height:11px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 16px rgba(139,92,246,.7);}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--border);font-size:17px;transition:.16s;flex-shrink:0;}
.icon-btn:active{transform:scale(.93);}
@media(hover:hover){.icon-btn:hover{background:var(--card-2);transform:translateY(-1px);}}

.hero{padding:10px 0 26px;}
.hero h1{margin:0 0 10px;font-size:30px;line-height:1.12;letter-spacing:-.035em;font-weight:800;
  background:linear-gradient(120deg,var(--text) 20%, var(--accent) 65%, var(--accent-2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
@media(min-width:620px){.hero h1{font-size:36px;}}
.hero p{margin:0;color:var(--muted);font-size:14.5px;max-width:520px;}

.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);
  font-weight:700;margin:26px 0 12px;}
.section-title:first-child{margin-top:8px;}

.exam-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:620px){.exam-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:880px){.exam-grid{grid-template-columns:repeat(4,1fr);}}
.exam-card{
  position:relative;overflow:hidden;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 14px;text-align:left;transition:transform .12s, border-color .18s, box-shadow .18s;
  display:flex;flex-direction:column;gap:8px;min-height:120px;
  cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
.exam-card:active{transform:scale(.96);border-color:var(--accent);}
@media(hover:hover){.exam-card:hover{transform:translateY(-3px);border-color:var(--accent);
  box-shadow:0 12px 30px rgba(99,102,241,.22);}}
.exam-card .emoji{font-size:26px;line-height:1;pointer-events:none;}
.exam-card .name{font-weight:700;font-size:15px;letter-spacing:-.01em;pointer-events:none;}
.exam-card .sub{font-size:11.5px;color:var(--muted);pointer-events:none;}
.exam-card::after{content:'';position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;
  border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.28),transparent 70%);
  pointer-events:none;}

.mode-grid{display:grid;gap:14px;margin-top:8px;}
@media(min-width:640px){.mode-grid{grid-template-columns:1fr 1fr;}}
.mode-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:22px 18px;text-align:left;transition:transform .12s, border-color .18s, box-shadow .18s;
  display:flex;flex-direction:column;gap:8px;cursor:pointer;
  -webkit-appearance:none;appearance:none;min-height:var(--tap);}
.mode-card:active{transform:scale(.98);border-color:var(--accent-2);}
@media(hover:hover){.mode-card:hover{transform:translateY(-3px);border-color:var(--accent-2);
  box-shadow:0 14px 34px rgba(139,92,246,.22);}}
.mode-icon{font-size:32px;pointer-events:none;}
.mode-title{font-weight:750;font-size:18px;letter-spacing:-.02em;pointer-events:none;}
.mode-sub{font-size:13px;color:var(--muted);pointer-events:none;}

.chip-grid{display:flex;flex-wrap:wrap;gap:9px;}
.chip{background:var(--card);border:1px solid var(--border);border-radius:999px;
  padding:10px 16px;font-size:13.5px;font-weight:600;transition:.15s;color:var(--text);
  min-height:var(--tap);display:inline-flex;align-items:center;cursor:pointer;
  -webkit-appearance:none;appearance:none;}
.chip:active{transform:scale(.95);}
@media(hover:hover){.chip:hover{border-color:var(--accent);}}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35);}
.chip-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;}

.check-list{display:grid;gap:8px;grid-template-columns:1fr;max-height:340px;overflow-y:auto;
  padding:4px;border-radius:var(--radius);-webkit-overflow-scrolling:touch;}
@media(min-width:700px){.check-list{grid-template-columns:1fr 1fr;}}
.check-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 13px;font-size:13.5px;cursor:pointer;transition:.14s;
  text-align:left;min-height:var(--tap);-webkit-appearance:none;appearance:none;color:var(--text);}
.check-item:active{transform:scale(.98);}
@media(hover:hover){.check-item:hover{border-color:var(--accent);}}
.check-item.on{border-color:var(--accent);background:rgba(99,102,241,.13);}
.check-box{width:19px;height:19px;min-width:19px;border-radius:6px;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:.14s;}
.check-item.on .check-box{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;}

.btn{border-radius:12px;padding:11px 18px;font-weight:650;font-size:14px;
  background:var(--card-2);border:1px solid var(--border);color:var(--text);transition:.16s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);cursor:pointer;-webkit-appearance:none;appearance:none;}
.btn:active{transform:scale(.97);}
@media(hover:hover){.btn:hover{transform:translateY(-1px);border-color:var(--accent);}}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;
  box-shadow:0 8px 22px rgba(99,102,241,.34);}
.btn.ghost{background:transparent;}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.big{width:100%;padding:15px;font-size:15.5px;margin-top:26px;min-height:52px;}
.btn.small{padding:8px 14px;font-size:12.5px;border-radius:9px;min-height:38px;}
.btn:disabled{opacity:.45;pointer-events:none;}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-sm);}
.card h3{margin:0 0 12px;font-size:15px;letter-spacing:-.01em;}

input[type=file]{width:100%;padding:14px;border-radius:12px;border:1.5px dashed var(--border);
  background:var(--bg-2);font-size:13px;cursor:pointer;color:var(--text);}
input[type=number],input[type=text],input[type=password]{
  background:var(--bg-2);border:1px solid var(--border);border-radius:10px;
  padding:11px 12px;outline:none;width:100%;transition:.15s;color:var(--text);}
input[type=number]{width:110px;}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.16);}
@media(max-width:640px){
  input[type=number],input[type=text],input[type=password],input[type=file]{font-size:16px;}
}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:650;margin-bottom:7px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.07em;}

.progress-outer{height:8px;background:var(--card-2);border-radius:99px;overflow:hidden;margin-top:10px;}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .3s;border-radius:99px;}

.overlay{position:fixed;inset:0;background:rgba(5,7,12,.8);backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  z-index:900;padding:24px;text-align:center;}
.spinner{width:52px;height:52px;border-radius:50%;
  border:4px solid rgba(139,92,246,.18);border-top-color:var(--accent-2);
  animation:spin .85s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loaderText{font-weight:600;font-size:15px;max-width:400px;}
#loaderSub{color:var(--muted);font-size:13px;max-width:420px;}

#screen-test{flex-direction:column;height:100vh;height:100dvh;background:var(--bg);
  overflow:hidden;position:fixed;inset:0;z-index:50;}
.test-topbar{display:flex;align-items:center;gap:10px;padding:10px 12px;
  padding-top:max(10px, env(safe-area-inset-top));
  border-bottom:1px solid var(--border);background:var(--bg-2);flex-shrink:0;}
.test-title{flex:1;font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;letter-spacing:.03em;flex-shrink:0;}
.timer.warn{border-color:var(--red);color:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.55;}}

.test-body{flex:1;display:flex;overflow:hidden;position:relative;min-height:0;}
.q-area{flex:1;overflow-y:auto;padding:18px 16px 40px;-webkit-overflow-scrolling:touch;min-width:0;}
.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.q-counter{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;}
.badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
.badge.easy{background:rgba(34,197,94,.16);color:#4ade80;}
.badge.medium{background:rgba(245,158,11,.16);color:#fbbf24;}
.badge.hard{background:rgba(239,68,68,.16);color:#f87171;}
.badge.topic{background:rgba(99,102,241,.16);color:#a5b4fc;}
.q-text{font-size:16.5px;line-height:1.62;font-weight:550;margin-bottom:20px;letter-spacing:-.005em;
  word-wrap:break-word;}
@media(min-width:640px){.q-text{font-size:17.5px;}}
.q-text img{max-width:100%;border-radius:12px;border:1px solid var(--border);margin:14px auto 4px;display:block;}
.options{display:flex;flex-direction:column;gap:10px;}
.option{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  background:var(--card);border:1.5px solid var(--border);border-radius:13px;
  padding:14px 15px;font-size:14.5px;line-height:1.5;transition:.15s;min-height:var(--tap);
  -webkit-appearance:none;appearance:none;color:var(--text);cursor:pointer;}
.option:active{transform:scale(.985);}
@media(hover:hover){.option:hover{border-color:var(--accent);transform:translateX(2px);}}
.option.selected{border-color:transparent;
  background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(168,85,247,.22));
  box-shadow:0 0 0 1.5px var(--accent) inset;}
.opt-key{width:28px;height:28px;min-width:28px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-size:12.5px;font-weight:800;
  background:var(--card-2);border:1px solid var(--border);transition:.15s;flex-shrink:0;}
.option.selected .opt-key{background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;border-color:transparent;}

.palette{width:290px;flex-shrink:0;border-left:1px solid var(--border);background:var(--bg-2);
  padding:16px;overflow-y:auto;transition:transform .26s cubic-bezier(.4,0,.2,1);
  -webkit-overflow-scrolling:touch;}
.palette-head{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:750;
  color:var(--muted);margin-bottom:12px;}
.legend{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:12px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:8px;}
.dot{width:12px;height:12px;border-radius:4px;flex-shrink:0;}
.dot.grey{background:var(--grey);} .dot.red{background:var(--red);}
.dot.green{background:var(--green);} .dot.purple{background:var(--purple);}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.pal-btn{aspect-ratio:1;border-radius:10px;font-weight:750;font-size:13px;color:#fff;
  display:flex;align-items:center;justify-content:center;transition:.14s;
  border:2px solid transparent;min-width:0;padding:0;-webkit-appearance:none;appearance:none;}
.pal-btn:active{transform:scale(.92);}
.pal-btn.grey{background:var(--grey);} .pal-btn.red{background:var(--red);}
.pal-btn.green{background:var(--green);} .pal-btn.purple{background:var(--purple);}
.pal-btn.cur{border-color:var(--text);transform:scale(1.07);
  box-shadow:0 0 0 3px rgba(99,102,241,.28);}

.test-footer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);
  background:var(--bg-2);flex-shrink:0;flex-wrap:wrap;
  padding-bottom:max(10px, env(safe-area-inset-bottom));}
.test-footer .btn{flex:1 1 auto;min-width:72px;padding:10px 8px;font-size:12px;
  min-height:var(--tap);white-space:nowrap;}
@media(min-width:600px){.test-footer .btn{font-size:13px;padding:11px 10px;}}

@media(max-width:899px){
  .palette{position:absolute;top:0;right:0;bottom:0;transform:translateX(102%);
    z-index:60;box-shadow:-14px 0 40px rgba(0,0,0,.5);max-width:88vw;}
  .palette.open{transform:none;}
}
@media(min-width:900px){ #btnPaletteToggle{display:none;} }

.score-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;
  box-shadow:var(--shadow-sm);}
@media(min-width:640px){.score-card{flex-direction:row;justify-content:center;gap:44px;}}
.ring-wrap{position:relative;width:150px;height:150px;flex-shrink:0;}
.ring{transform:rotate(-90deg);width:150px;height:150px;}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round;}
.ring-bg{stroke:var(--card-2);}
.ring-fg{stroke:url(#ringGrad);transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.ring-label .pct{font-size:30px;font-weight:800;letter-spacing:-.03em;}
.ring-label .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.11em;font-weight:700;}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:340px;}
.stat{background:var(--card-2);border-radius:12px;padding:12px 14px;}
.stat .v{font-size:17px;font-weight:750;letter-spacing:-.02em;word-break:break-word;}
.stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;font-weight:650;margin-top:2px;}

.bar-row{margin-bottom:14px;}
.bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;
  font-weight:600;gap:10px;}
.bar-outer{height:9px;background:var(--card-2);border-radius:99px;overflow:hidden;}
.bar-inner{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.bar-inner.good{background:linear-gradient(90deg,#16a34a,#4ade80);}
.bar-inner.mid{background:linear-gradient(90deg,#d97706,#fbbf24);}
.bar-inner.bad{background:linear-gradient(90deg,#dc2626,#f87171);}

.tag-list{display:flex;flex-wrap:wrap;gap:8px;}
.tag{font-size:12.5px;font-weight:650;padding:6px 12px;border-radius:99px;}
.tag.weak{background:rgba(239,68,68,.14);color:#f87171;border:1px solid rgba(239,68,68,.3);}
.tag.strong{background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.3);}

.review-item{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:16px;margin-bottom:12px;}
.review-item .rq{font-weight:600;font-size:14.5px;margin-bottom:12px;line-height:1.55;
  word-wrap:break-word;}
.rev-opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;
  font-size:13.5px;margin-bottom:6px;border:1px solid transparent;background:var(--card-2);
  word-wrap:break-word;}
.rev-opt.correct{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);}
.rev-opt.wrong{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4);}
.rev-explain{margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--card-2);
  font-size:13px;color:var(--muted);border-left:3px solid var(--accent);}
.verdict{font-size:11px;font-weight:750;padding:3px 9px;border-radius:99px;letter-spacing:.05em;
  white-space:nowrap;}
.verdict.ok{background:rgba(34,197,94,.16);color:#4ade80;}
.verdict.no{background:rgba(239,68,68,.16);color:#f87171;}
.verdict.sk{background:rgba(139,148,163,.18);color:var(--muted);}

.modal-overlay{position:fixed;inset:0;background:rgba(5,7,12,.75);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:18px;
  animation:fadeUp .2s ease;overflow-y:auto;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:22px;max-width:460px;width:100%;box-shadow:var(--shadow);max-height:88vh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;margin:auto;}
.modal h3{margin:0 0 8px;font-size:18px;letter-spacing:-.02em;}
.modal p{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.6;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.modal-actions .btn{flex:1;min-width:110px;}

.bank-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;
  margin-bottom:11px;display:flex;flex-direction:column;gap:11px;}
.bank-item .bi-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.bank-item .bi-name{font-weight:650;font-size:14px;word-break:break-word;}
.bank-item .bi-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.bank-item .bi-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.bank-item .bi-mode{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;
  text-transform:uppercase;letter-spacing:.05em;}
.bi-mode.extract{background:rgba(34,197,94,.16);color:#4ade80;}
.bi-mode.notes{background:rgba(168,85,247,.16);color:#c084fc;}

.appfooter{margin-top:56px;padding-top:24px;border-top:1px solid var(--border);
  text-align:center;font-size:13px;}
.appfooter a{font-weight:650;opacity:.85;transition:.15s;}
.appfooter a:hover{opacity:1;}

.resume{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.18));
  border:1px solid rgba(139,92,246,.4);border-radius:14px;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;margin-bottom:8px;}
.resume .rt{font-weight:650;font-size:13.5px;}
.resume .rs{font-size:12px;color:var(--muted);}

.hist-item{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:11px;
  margin-bottom:8px;font-size:13px;align-items:center;flex-wrap:wrap;}
.hist-item .hp{font-weight:750;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px;}
::-webkit-scrollbar-thumb:hover{background:var(--grey);}
</style>
